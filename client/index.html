<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#e11d2e" />
    <meta
      name="description"
      content="MyHealthAid - shared treatment tracking for patients and doctors."
    />
    <title>MyHealthAid</title>
    <script>
      // Applied synchronously, before first paint, so the page never flashes
      // the wrong theme while React boots.
      (function () {
        try {
          var stored = localStorage.getItem('myhealthaid.theme');
          var theme =
            stored === 'light' || stored === 'dark'
              ? stored
              : window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light';
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {
          /* localStorage unavailable (private mode) - default styling (light) applies */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
