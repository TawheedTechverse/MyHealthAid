# Render blueprint: one-click deploy of the MyHealthAid API + its database.
#
#   1. Push this repo to GitHub.
#   2. Render dashboard -> New -> Blueprint -> pick this repo.
#   3. Fill in the two `sync: false` vars when prompted:
#        CLIENT_ORIGIN   -> your Vercel URL, e.g. https://my-health-aid.vercel.app
#        GEMINI_API_KEY  -> optional; leave blank to skip AI visit-note summaries
#                           (get one at https://aistudio.google.com/apikey)
#   4. After the first deploy, load demo accounts from the service Shell:
#        npm run seed
#
# Then set VITE_API_URL in Vercel to  https://<this-service>.onrender.com/api  and redeploy the client.

databases:
  - name: myhealthaid-db
    plan: free

services:
  - type: web
    name: myhealthaid-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install && npm run migrate
    startCommand: npm run start
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: myhealthaid-db
          property: connectionString
      - key: PG_SSL
        value: "true"
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_ORIGIN
        sync: false
      - key: GEMINI_API_KEY
        sync: false
